# Hand-curated. Four rows, twenty minutes, more accurate than any scraper.
# Canonical origins are load-bearing — docs/08-source-landscape.md §1 is the ONLY
# place hostnames are stated. Two campuses serve on a host the v2.0 docs did not use.
- slug: manila
  name: Technological University of the Philippines - Manila
  short_name: TUP Manila
  kind: main
  website: https://tup.edu.ph
  website_status: active
  address:
    street: Ayala Boulevard, Ermita
    city: Manila
    region: National Capital Region
  established: 1901
  description: >-
    The main campus of the TUP system. Six colleges. Legacy PHP CMS behind a Sucuri WAF
    with two live content generations.

- slug: cavite
  name: Technological University of the Philippines - Cavite
  short_name: TUP Cavite
  kind: satellite
  # Apex returned 403 on 2026-08-20; all routes must use www. docs/08 §4.1
  website: https://www.tupcavite.edu.ph
  # 'unavailable' since 2026-08-29: three verification runs an hour apart all timed out
  # against both hosts. The value means "we could not reach it", which is exactly what
  # we know — not "it is down for everyone", which we do not. It flips back the moment
  # a verification run reaches it, and docs/08 §4.1 records what to check first.
  website_status: unavailable
  address:
    city: Dasmarinas
    province: Cavite
    region: CALABARZON
  description: >-
    Uses departments rather than colleges. This is the vocabulary difference that
    justifies ADR-002's unit_type discriminator.

- slug: visayas
  name: Technological University of the Philippines - Visayas
  short_name: TUP Visayas
  kind: satellite
  website: https://tupvisayas.edu.ph
  website_status: active
  address:
    city: Talisay
    province: Negros Occidental
    region: Western Visayas
  description: >-
    Laravel behind Cloudflare, best-structured of the four sites. Serves AI-crawler
    directives and a Content-Signal reservation of rights — docs/08 §5.1.

- slug: taguig
  name: Technological University of the Philippines - Taguig
  short_name: TUP Taguig
  kind: satellite
  website: https://tupt.edu.ph
  # Was a cPanel-suspended account serving HTTP 200 on 2026-08-20. Re-verified
  # 2026-08-29: the suspension is lifted and the site serves a real page (55.9 KB,
  # <title>TUP-T</title>). ADR-012's "on first 200, build the adapter" trigger has
  # fired — that is M9 work. docs/08 §6.
  website_status: active
  # Still 'low', and deliberately so: the site being reachable is not the same as
  # anything in this row having been read from it. Every fact here still comes from a
  # sibling site. It becomes 'high' when the Taguig adapter crawls the campus (M9),
  # not when the host starts answering. docs/08 §6, docs/09 §2.
  confidence: low
  description: >-
    Modelled as a first-class campus. Its site returned a cPanel suspension notice
    through 2026-08-20 and came back online by 2026-08-29; nothing here has been
    crawled from it yet, which is what the low confidence records.
