# Canonical program registry — the campus-agnostic degree list (ADR-003).
#
# HAND-MAINTAINED ON PURPOSE. Never auto-create a canonical program from a fuzzy
# match: that produces near-duplicate degrees which are painful to merge later.
# Unmatched offerings are written with program_id = NULL and surfaced by
# `pnpm ingest:unmatched`, then resolved into this file by a human.
#
# This is a STARTING SET, not an enumeration of every TUP degree. Trying to enumerate
# them all before writing an adapter is the breadth-before-depth anti-pattern that
# docs/04-implementation-plan.md warns about. Grow it from ingest:unmatched output,
# and verify each entry against the campus source page before relying on it.
#
# `aliases` carries source name variants seen in the wild. The matching chain searches
# it on every offering, so an alias added here removes a manual resolution later.

