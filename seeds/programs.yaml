# ─────────────────────────────────────────────────────────────────────────────
# Resolved from `pnpm ingest:unmatched` after the first Manila crawl, 2026-08-29.
#
# Every entry below was read off a TUP Manila college "Courses Offered" page and
# verified against it by hand. This is the hour of work docs/04 §1.4 says to expect,
# and it is the reason ADR-003 forbids auto-creating a canonical program from a fuzzy
# match: several of these are genuinely distinct degrees whose names differ by one
# word from something already in the registry.
#
# WHAT IS DELIBERATELY *NOT* HERE — read this before adding more.
#
# 62 Manila offerings remain unmatched, and every one of them is a "…major in X"
# (or "…option in Y") variant of a base degree: BET, BTVTEd, BTLEd, Graphics
# Technology, MSCE, MSEE, MSME, MEng, MAIE, MAT, DEd, PhD. They are NOT aliased to
# their base degrees yet, on purpose:
#
#   1. `program_offerings` is UNIQUE (program_id, campus_id). Aliasing Manila's
#      fourteen BET variants to `bet` collapses fourteen rows into one offering whose
#      `majors[]` carries the variants. That is the correct end state — it is what the
#      `majors text[]` column exists for — but it discards thirteen verbatim
#      `source_name` values in the process.
#   2. docs/04 §2.4 puts that decision in Phase 2 and says why: the real ambiguity is
#      cross-campus ("Cavite's BET major in Automotive Engineering Technology vs
#      Manila's BET variants"). Deciding it now, with one campus of evidence, means
#      deciding it again later with better evidence.
#
# So the boundary is a rule, not a backlog: a standalone degree name is canonical here;
# a major/option variant stays unmatched until Phase 2. `pnpm ingest:unmatched` lists
# them, and the pipeline merges `majors[]` correctly the day the aliases are added.
# ─────────────────────────────────────────────────────────────────────────────

