# ─────────────────────────────────────────────────────────────────────────────
# Cross-campus resolution, 2026-08-29 — the Phase 2.4 work, done with the evidence
# docs/04 §2.4 said to wait for.
#
# THE RULE, stated once so the next person applies it the same way:
#
#   A canonical program is the AWARD — the degree as CHED would name it. Everything
#   after "major in", "with specialization in", or "option in" is a specialisation and
#   belongs in `program_offerings.majors`, not in a separate canonical row. Where a
#   campus embeds the discipline before the major ("Masters of Engineering Program in
#   Civil Engineering major in Structural Engineering Option"), the discipline is part
#   of the specialisation too: it names which flavour of the award, not a new award.
#
# WHY, since the alternative is tempting: `program_offerings` is UNIQUE (program_id,
# campus_id) — one offering per award per campus. Giving each specialisation its own
# canonical row would let "Bachelor of Engineering Technology" appear 36 times across
# three campuses as 31 near-duplicate degrees, which is precisely the outcome ADR-003
# forbids. Under the rule it appears three times, once per campus, each carrying its
# own majors[] and its own unit — and `GET /v1/programs/bet` answers "where can I
# study engineering technology" the way a student would ask it.
#
# WHAT IT COSTS: an offering that merges keeps the first verbatim `source_name` it was
# seen under. The other spellings survive in `majors[]`, so nothing is lost, but the
# per-variant verbatim string is no longer individually addressable. That trade was
# made deliberately and is the reason this block is commented at this length.
#
# Every alias below was read off a live campus page on 2026-08-29 via
# `pnpm ingest:unmatched`. None was inferred.
# ─────────────────────────────────────────────────────────────────────────────

