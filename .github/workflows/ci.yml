name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match production's major version. Supabase runs Postgres 17.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: tup
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/tup
      DATABASE_URL_POOLED: postgresql://postgres:dev@localhost:5432/tup
      # CI never touches live TUP sites. docs/05 §1
      FETCH_MODE: fixtures

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: CI gates
        run: ./scripts/ci-gates.sh

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Seed is idempotent
        run: pnpm db:seed

      - name: Ingest every campus from committed fixtures
        # FETCH_MODE=fixtures, so this reaches no TUP host. The contract tests assert
        # against real crawled rows (M7) and against three campuses at once (M9), which
        # have to exist before they run.
        run: |
          pnpm ingest --adapter=manila --full
          pnpm ingest --adapter=visayas --full
          pnpm ingest --adapter=taguig --full

      - name: Second run is all-unchanged — content-hash gating (E2, M6 checkpoint)
        run: |
          for campus in manila visayas taguig; do
            pnpm ingest --adapter=$campus > /tmp/second-$campus.txt
            cat /tmp/second-$campus.txt
            grep -q "fetched=0" /tmp/second-$campus.txt \
              || (echo "::error::$campus re-fetched instead of hash-gating" && exit 1)
            grep -q "0 change_events" /tmp/second-$campus.txt \
              || (echo "::error::$campus wrote change events for unchanged content" && exit 1)
          done

      - name: Every offering resolves to a canonical program (ADR-003)
        run: |
          pnpm ingest:unmatched > /tmp/unmatched.txt
          cat /tmp/unmatched.txt
          grep -q "No unmatched offerings" /tmp/unmatched.txt \
            || echo "::warning::unmatched offerings exist — resolve them in seeds/programs.yaml"

      - name: M9 gate — no migration was needed to add campuses 2 and 3
        # Every campus lives in the same tables, told apart by campus_slug and
        # unit_type. A per-campus table or column would show up here as a migration
        # whose name mentions a campus. docs/04 §2.
        run: |
          if ls packages/db/migrations/*.sql | grep -iE "visayas|taguig|cavite|manila"; then
            echo "::error::a migration is named after a campus — the schema is not campus-agnostic"
            exit 1
          fi
          echo "ok — 8 migrations, none campus-specific"


      - run: pnpm test

      - name: Spec drift gate
        # The OpenAPI document is generated from the code that runs. If it differs from
        # the committed copy, a public contract changed — that must be intentional and
        # reviewable, never a side effect. docs/05 §3.2
        run: |
          pnpm openapi:generate
          git diff --exit-code apps/api/openapi.json \
            || (echo "::error::openapi.json is out of date. Run 'pnpm openapi:generate' and commit the diff." && exit 1)
